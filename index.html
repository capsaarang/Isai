<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="Isai: a personal, ad-free music and podcast player">
<title>Isai</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>

  <div id="mini" class="hidden" role="button" aria-label="Open player">
    <div class="art" id="mini-art"></div>
    <div class="meta"><div class="t ellipsis" id="mini-title"></div><div class="s ellipsis" id="mini-sub"></div></div>
    <button class="iconbtn" id="mini-like" aria-label="Like"></button>
    <button class="iconbtn" id="mini-play" aria-label="Play or pause"></button>
    <div class="bar"><i id="mini-bar"></i></div>
  </div>

  <nav id="nav">
    <button data-tab="home"><svg class="icon"><use href="#i-home"/></svg>Home</button>
    <button data-tab="search"><svg class="icon"><use href="#i-search"/></svg>Search</button>
    <button data-tab="discover"><svg class="icon"><use href="#i-compass"/></svg>Discover</button>
    <button data-tab="podcasts"><svg class="icon"><use href="#i-mic"/></svg>Podcasts</button>
    <button data-tab="library"><svg class="icon"><use href="#i-library"/></svg>Library</button>
  </nav>
</div>

<section id="np" aria-label="Now playing">
  <div class="np-top">
    <button class="iconbtn" id="np-close" aria-label="Close player"><svg class="icon"><use href="#i-down"/></svg></button>
    <div class="from"><div class="muted" style="font-size:11px">PLAYING FROM</div><div class="ellipsis" id="np-from" style="font-weight:600"></div></div>
    <button class="iconbtn" id="np-more" aria-label="More options"><svg class="icon"><use href="#i-dots"/></svg></button>
  </div>
  <div class="art np-art" id="np-art"></div>
  <div class="np-info">
    <div class="meta"><div class="np-title ellipsis" id="np-title"></div><div class="np-sub ellipsis" id="np-sub"></div></div>
    <button class="iconbtn" id="np-like" aria-label="Like"></button>
  </div>
  <div class="seek" id="np-seekwrap">
    <input type="range" id="np-seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
  </div>
  <div class="controls" id="np-controls"></div>
  <div class="np-bottom">
    <button id="np-sleep"><svg class="icon sm"><use href="#i-moon"/></svg><span id="np-sleep-label">Sleep</span></button>
    <button id="np-add"><svg class="icon sm"><use href="#i-plus"/></svg>Add</button>
    <button id="np-together"><svg class="icon sm"><use href="#i-users"/></svg>Together</button>
    <button id="np-queue"><svg class="icon sm"><use href="#i-list"/></svg>Queue</button>
  </div>
</section>

<div id="together" class="hidden"></div>
<div id="picker" class="hidden"></div>
<div id="scrim"></div>
<div id="sheet" role="dialog"></div>
<div id="toast"></div>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac" multiple hidden>
<audio id="audio" preload="auto"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
